services:
  mcp:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "bun install && bun run src/mcp/http.ts"
    # Loopback only — the host reverse-proxy (DollarDeploy nginx) fronts it.
    ports:
      - "127.0.0.1:${PORT:-3011}:3001"
    environment:
      - MCP_PORT=3001
    restart: unless-stopped

volumes:
  node_modules:
